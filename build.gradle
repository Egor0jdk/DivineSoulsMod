plugins {
    id 'java-library' // Поддержка стандартных Java-библиотек
    id 'maven-publish' // Возможность публиковать мод в репозитории
    id 'net.neoforged.moddev' version '1.0.21' // Официальный плагин разработки для NeoForge
    id "org.jetbrains.kotlin.jvm" version ("2.0.21") // Плагин для компиляции кода на Kotlin
}

// Настройка локального Gradle-враппера
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Глобальные переменные мода (берутся автоматически из gradle.properties)
version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Репозиторий языкового провайдера Kotlin for Forge
    maven {
        name = "Kotlin for Forge"
        setUrl("https://thedarkcolour.github.io/KotlinForForge/")
    }
    maven {
        name = "Illusive C4 Maven"
        setUrl("https://maven.theillusivec4.top/")
    }
}

// Имя выходного .jar файла мода
base {
    archivesName = mod_id
}

// Майнкрафт 1.20.5+ и 1.21.1 жестко требуют Java 21 для компиляции и работы
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Версия NeoForge (задается в gradle.properties)
    version = project.neo_version

    // Подключение Parchment — маппингов с человеческими названиями параметров и Javadoc
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Настройки сред запуска игры из среды разработки (IDE)
    runs {
        client {
            client() // Конфигурация для запуска клиента игры (runClient)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server() // Конфигурация для запуска выделенного сервера (runServer)
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer" // Запуск сервера для автоматических тестов
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data() // Конфигурация запуска генератора данных (Data Generation)
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Общие настройки логов для всех сред запуска выше
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG // Включаем подробный дебаг-режим в консоли
        }
    }

    // Привязка исходников проекта к ID мода (NeoForge автоматически сканирует main-сет)
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Подключаем папку сгенерированных ресурсов датагенератора в общую сборку
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Настройка конфигурации runtime-зависимостей для тестирования внутри IDE
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Ключевая зависимость: Подключаем языковой лоадер Kotlin for Forge (KFF)
    implementation("thedarkcolour:kotlinforforge-neoforge:$kff_version")
    // ПРАВИЛЬНОЕ ПОДКЛЮЧЕНИЕ ДЛЯ СРЕДЫ РАЗРАБОТКИ:
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.4.2+1.21.1:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.4.2+1.21.1"
}

// Автоматическая подстановка метаданных из gradle.properties в шаблоны ресурсов мода
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            kff_version            : kff_version,
            kff_version_range      : kff_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Связываем генерацию метаданных с ресурсами проекта
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Настройка для публикации мода в Maven (при необходимости)
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Принудительно компилируем Java-файлы в UTF-8 кодировке для избежания багов на Windows/Linux
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Автоматическое скачивание исходников (Sources) и документации (Javadoc) для зависимостей
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
